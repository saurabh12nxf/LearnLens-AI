[project]
name = "learnlens-backend"
version = "0.1.0"
description = "LearnLens AI Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "PyMuPDF>=1.23.0",
    "groq>=0.9.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
