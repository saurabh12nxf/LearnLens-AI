[project]
name = "learnlens-backend"
version = "0.1.0"
description = "LearnLens AI Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "PyMuPDF>=1.23.0",
    "groq>=0.9.0",
    "fastembed>=0.3.0",
    "numpy>=1.25.0",
]

[tool.uv]
package = false
